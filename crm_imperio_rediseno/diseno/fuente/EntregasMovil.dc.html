<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entregas · CRM Imperio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f8fb}
a{color:#0e7fe6}a:hover{color:#108dff}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tab{font-variant-numeric:tabular-nums}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6f8fb; color: #2f384f; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: -0.01em; font-size: 14px; line-height: 20px; display: flex; flex-direction: column">

  <header style="background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 24px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.04em">Entregas</h1>
        <span style="font-size: 13px; line-height: 18px; color: #4a5a6b">Control de logística y despachos</span>
      </div>
      <button type="button" aria-label="Exportar hoja de ruta en PDF" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; color: #108dff; display: inline-flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M12 18v-6"></path><path d="m9 15 3 3 3-3"></path></svg></button>
    </div>
    <div role="group" aria-label="Estado" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 2px; background: #f0f4f7; border: 1px solid #dee2e6; border-radius: 4px">
      <button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 4px; background: #ffffff; box-shadow: 0 2px 8px rgba(9, 30, 66, .06); font-size: 13px; font-weight: 600; color: #2f384f">Para entregar · 9</button>
      <button type="button" style="height: 36px; border: 0; border-radius: 4px; background: transparent; font-size: 13px; color: #4a5a6b">Entregadas hoy · 4</button>
    </div>
    <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 13px; font-weight: 600; color: #2f384f">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: #108dff"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      Zona: todas las localidades
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: #4a5a6b"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 14px 16px 100px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{zones}}" as="z" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 class="tab" style="margin: 0; padding: 0 4px; font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #4a5a6b">{{z.label}}</h2>
        <sc-for list="{{z.items}}" as="d" hint-placeholder-count="2">
          <article style="background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 2px 8px rgba(9, 30, 66, .06); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
            <a href="FichaMovil.dc.html" style="display: flex; gap: 12px; text-decoration: none; color: #2f384f">
              <span style="width: 40px; height: 40px; border-radius: 50%; background: {{d.avatar}}; color: #ffffff; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">{{d.ini}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="display: flex; justify-content: space-between; gap: 8px">
                  <span style="font-size: 15px; line-height: 20px; font-weight: 600">{{d.client}}</span>
                  <span class="tab" style="font-size: 13px; line-height: 20px; font-weight: 600">{{d.total}}</span>
                </span>
                <span style="font-size: 13px; line-height: 18px; color: #4a5a6b">{{d.item}}</span>
                <span style="font-size: 13px; line-height: 18px">{{d.address}}</span>
                <span class="tab" style="font-size: 12px; line-height: 16px; color: #4a5a6b">Aprobó {{d.verifier}} · {{d.when}}</span>
              </span>
            </a>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <a href="#" style="height: 44px; border: 1px solid #dee2e6; border-radius: 8px; text-decoration: none; color: #2f384f; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #108dff"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                Cómo llegar
              </a>
              <button type="button" style="height: 44px; border: 0; border-radius: 8px; background: #108dff; color: #ffffff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
                Entregar
              </button>
            </div>
          </article>
        </sc-for>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding-bottom: 20px; box-sizing: border-box; background: #ffffff; border-top: 1px solid #dee2e6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Movil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span style="font-size: 11px; line-height: 14px">Panel</span>
    </a>
    <a href="HistorialMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>
      <span style="font-size: 11px; line-height: 14px">Historial</span>
    </a>
    <a href="EntregasMovil.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #108dff">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg>
      <span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #2f384f">Entregas</span>
    </a>
    <a href="ComisionesMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><line x1="12" x2="12" y1="2" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span style="font-size: 11px; line-height: 14px">Comisiones</span>
    </a>
    <a href="MasMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
      <span style="font-size: 11px; line-height: 14px">Más</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const zones = [
      { label: 'Yerba Buena · 2', items: [
        { ini: 'MS', avatar: '#963b68', client: 'Mario Sánchez Alderete', total: '$650.000', item: 'Smart TV 43"', address: 'Av. Aconquija 2210 · B° San José', verifier: 'Pablo Ibáñez', when: 'hoy 11:05' },
        { ini: 'CB', avatar: '#287f71', client: 'Claudia Brito', total: '$910.000', item: 'Lavarropas automático 8 kg', address: 'Pasaje Los Ceibos 45 · B° Cevil', verifier: 'Lucas Ferreyra', when: 'ayer' }

      ] }
    ];
    return { zones };
  }
}
</script>
</body>
</html>
