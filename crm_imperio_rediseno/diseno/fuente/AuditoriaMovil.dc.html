<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Auditoría · CRM Imperio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f8fb}
a{color:#0e7fe6}a:hover{color:#108dff}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tab{font-variant-numeric:tabular-nums}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6f8fb; color: #2f384f; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: -0.01em; font-size: 14px; line-height: 20px; display: flex; flex-direction: column">

  <header style="background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <a href="MasMovil.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -8px; font-size: 15px; font-weight: 600; text-decoration: none">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="m15 18-6-6 6-6"></path></svg>
      Más
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.04em">Auditoría</h1>
      <span style="font-size: 13px; line-height: 18px; color: #4a5a6b">Registro de acciones críticas del sistema</span>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 34px; padding: 0 12px; border: 1px solid #108dff; border-radius: 4px; background: rgba(16, 141, 255, .10); font-size: 13px; font-weight: 600; color: #2f384f">Todas</button>
      <button type="button" style="flex-shrink: 0; height: 34px; padding: 0 12px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 13px; color: #2f384f">Ventas</button>
      <button type="button" style="flex-shrink: 0; height: 34px; padding: 0 12px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 13px; color: #2f384f">Usuarios</button>
      <button type="button" style="flex-shrink: 0; height: 34px; padding: 0 12px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 13px; color: #2f384f">Accesos</button>
      <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 13px; color: #2f384f">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: #108dff"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
        Usuario: todos
      </button>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 14px 16px 100px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{days}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #4a5a6b">{{g.label}}</h2>
        <ol style="margin: 0; padding: 0; list-style: none; background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; overflow: hidden">
          <sc-for list="{{g.items}}" as="e" hint-placeholder-count="3">
            <li style="display: flex; gap: 12px; padding: 12px 14px; border-top: {{e.border}}">
              <span style="width: 32px; height: 32px; border-radius: 4px; background: {{e.bg}}; color: {{e.fg}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">
                <sc-if value="{{e.kOk}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                <sc-if value="{{e.kNo}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></sc-if>
                <sc-if value="{{e.kTruck}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg></sc-if>
                <sc-if value="{{e.kUser}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg></sc-if>
                <sc-if value="{{e.kLock}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></sc-if>
                <sc-if value="{{e.kEdit}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 20h9"></path><path d="M16.38 3.62a1 1 0 0 1 3 3L7.37 18.64a2 2 0 0 1-.86.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.86z"></path></svg></sc-if>
                <sc-if value="{{e.kDown}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg></sc-if>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 14px; line-height: 20px; font-weight: 600">{{e.title}}</span>
                <sc-if value="{{e.detail}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; line-height: 18px; color: #4a5a6b">{{e.detail}}</span></sc-if>
                <span class="tab" style="font-size: 12px; line-height: 16px; color: #4a5a6b">{{e.time}} · {{e.who}}</span>
              </span>
            </li>
          </sc-for>
        </ol>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding-bottom: 20px; box-sizing: border-box; background: #ffffff; border-top: 1px solid #dee2e6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Movil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span style="font-size: 11px; line-height: 14px">Panel</span>
    </a>
    <a href="HistorialMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>
      <span style="font-size: 11px; line-height: 14px">Historial</span>
    </a>
    <a href="EntregasMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg>
      <span style="font-size: 11px; line-height: 14px">Entregas</span>
    </a>
    <a href="ComisionesMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><line x1="12" x2="12" y1="2" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span style="font-size: 11px; line-height: 14px">Comisiones</span>
    </a>
    <a href="MasMovil.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #108dff">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
      <span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #2f384f">Más</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const K = {
      ok: { bg: 'rgba(40, 127, 113, .12)', fg: '#287f71' },
      no: { bg: 'rgba(231, 54, 107, .12)', fg: '#d03160' },
      truck: { bg: 'rgba(40, 127, 113, .12)', fg: '#287f71' },
      user: { bg: 'rgba(82, 44, 143, .10)', fg: '#522c8f' },
      lock: { bg: 'rgba(231, 118, 54, .14)', fg: '#d06a31' },
      edit: { bg: 'rgba(16, 141, 255, .12)', fg: '#0e7fe6' },
      down: { bg: '#f0f4f7', fg: '#4a5a6b' }
    };
    const mk = (items) => items.map((e, i) => ({
      ...e, ...K[e.k], detail: e.detail || false,
      kOk: e.k === 'ok', kNo: e.k === 'no', kTruck: e.k === 'truck', kUser: e.k === 'user', kLock: e.k === 'lock', kEdit: e.k === 'edit', kDown: e.k === 'down',
      border: i === 0 ? '0' : '1px solid #dee2e6'
    }));
    const days = [
      { label: 'Hoy', items: mk([
        { k: 'truck', title: 'Entregó la venta #1479', detail: 'Lorena Gramajo · $1.080.000', time: '16:40', who: 'Diego Ruiz' },
        { k: 'lock', title: 'Intento de ingreso fallido', detail: 'Usuario jsosa · 3 intentos, bloqueado 15 min', time: '15:58', who: 'Sistema' },
        { k: 'ok', title: 'Aprobó la venta #1481', time: '11:05', who: 'Pablo Ibáñez' },
        { k: 'edit', title: 'Editó el plan de pago de #1476', detail: '10 → 12 cuotas', time: '09:42', who: 'Alejandro Quevedo' }
      ]) },
      { label: 'Ayer', items: mk([
        { k: 'no', title: 'Rechazó la venta #1477', detail: 'Queda en lista negra', time: '18:20', who: 'Lucas Ferreyra' },
        { k: 'user', title: 'Dio de alta a Emilia Vera', detail: 'Vendedora · comisión 5%', time: '10:15', who: 'Alejandro Quevedo' },
        { k: 'down', title: 'Exportó el historial en CSV', time: '09:01', who: 'Alejandro Quevedo' }
      ]) }
    ];
    return { days };
  }
}
</script>
</body>
</html>
