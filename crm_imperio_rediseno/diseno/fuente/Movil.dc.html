<style>

a{color:#0e7fe6}a:hover{color:#108dff}

      </span>
      <span style="display: flex; align-items: center; gap: 4px">
        <button type="button" aria-label="Buscar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #2f384f; display: inline-flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>

      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #4a5a6b">Sábado 17 de octubre</span>
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.04em">Panel</h1>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px">

    <!-- Anillo compacto -->
    <section style="background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 2px 8px rgba(9, 30, 66, .06); padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <div style="position: relative; width: 68px; height: 68px; flex-shrink: 0">
        <svg viewBox="0 0 68 68" width="68" height="68" role="img" aria-label="Objetivo del mes: 72 por ciento" style="transform: rotate(-90deg)">
          <circle cx="34" cy="34" r="28" fill="none" stroke="#f0f4f7" stroke-width="8"></circle>
          <circle cx="34" cy="34" r="28" fill="none" stroke="#108dff" stroke-width="8" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="49.3"></circle>
        </svg>
        <span class="tab" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">72%</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span class="tab" style="font-size: 15px; line-height: 20px; font-weight: 600">18 de 25 ventas</span>
        <span style="font-size: 13px; line-height: 18px; color: #4a5a6b">Objetivo de octubre · faltan 7</span>
      </div>

      <button type="button" style="height: 36px; border: 0; border-radius: 4px; background: transparent; font: inherit; font-size: 13px; color: #4a5a6b">Aprobadas · 9</button>
      <button type="button" style="height: 36px; border: 0; border-radius: 4px; background: transparent; font: inherit; font-size: 13px; color: #4a5a6b">Rechazadas</button>
    </div>

    <!-- Lista agrupada -->
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; padding: 0 4px; font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #4a5a6b">Para verificar</h2>
      <div style="background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 2px 8px rgba(9, 30, 66, .06); overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">

            <span style="width: 40px; height: 40px; border-radius: 50%; background: {{r.avatar}}; color: #ffffff; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.ini}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; justify-content: space-between; gap: 8px">
                <span style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.client}}</span>
                <span class="tab" style="font-size: 11px; line-height: 20px; color: #4a5a6b; flex-shrink: 0">{{r.when}}</span>
              </span>
              <span class="tab" style="font-size: 13px; line-height: 18px; color: #4a5a6b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.item}} · {{r.total}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #2f384f">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>{{r.meta}}
              </span>
            </span>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #8c98a4"><path d="m9 18 6-6-6-6"></path></svg>
          </a>
        </sc-for>
      </div>
    </section>
  </div>

  <!-- Botón flotante -->
  <a href="NuevaVentaMovil.dc.html" aria-label="Nueva venta" style="position: absolute; right: 16px; bottom: 100px; width: 56px; height: 56px; border-radius: 50%; background: #108dff; color: #ffffff; box-shadow: 0 8px 16px rgba(9, 30, 66, .14); display: flex; align-items: center; justify-content: center">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
  </a>

  <!-- Tab bar: 4 fijas + Más -->
  <nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding-bottom: 20px; box-sizing: border-box; background: #ffffff; border-top: 1px solid #dee2e6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Main.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #108dff">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #2f384f">Panel</span>
      <span class="tab" style="position: absolute; top: 6px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #e7366b; color: #ffffff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box">12</span>
    </a>
    <a href="HistorialMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>
      <span style="font-size: 11px; line-height: 14px">Historial</span>
    </a>
    <a href="EntregasMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg>

    </a>
    <a href="ComisionesMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><line x1="12" x2="12" y1="2" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span style="font-size: 11px; line-height: 14px">Comisiones</span>
    </a>
    <a href="MasMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4a5a6b">

    </a>
  </nav>
</div>
