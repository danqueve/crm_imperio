<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva venta en celular · CRM Imperio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f8fb}
a{color:#0e7fe6}a:hover{color:#108dff}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tab{font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#108dff !important;box-shadow:0 0 0 3px rgba(16,141,255,.18)}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;background:#e9edf2"><div style="box-shadow:0 16px 48px rgba(9,30,66,.20);border-radius:24px;overflow:hidden"><div style="width: 390px; height: 844px; overflow: hidden; background: #f6f8fb; color: #2f384f; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: -0.01em; font-size: 14px; line-height: 20px; display: flex; flex-direction: column">

  <!-- Barra de navegación + progreso -->
  <header style="background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 0 4px 14px; flex-shrink: 0">
    <div style="height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <a href="Movil.html" style="justify-self: start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 15px; font-weight: 600; text-decoration: none">Cancelar</a>
      <span style="font-size: 15px; line-height: 20px; font-weight: 600">Nueva venta</span>
      <span class="tab" style="justify-self: end; padding: 0 12px; font-size: 13px; color: #4a5a6b">3 de 4</span>
    </div>
    <div style="padding: 0 12px; display: flex; flex-direction: column; gap: 10px">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <span style="height: 4px; border-radius: 2px; background: #108dff"></span>
        <span style="height: 4px; border-radius: 2px; background: #108dff"></span>
        <span style="height: 4px; border-radius: 2px; background: #108dff"></span>
        <span style="height: 4px; border-radius: 2px; background: #dee2e6"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.04em">Venta</h1>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: #4a5a6b">Artículo y plan de pago.</p>
      </div>
    </div>
  </header>

  <!-- Contenido del paso -->
  <div style="flex: 1; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 16px">

    <!-- Paso 1 · Cliente -->
    

    <!-- Paso 2 · Domicilio -->
    

    <!-- Paso 3 · Venta -->
    
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="padding: 12px; border: 1px solid #108dff; border-radius: 8px; background: rgba(16, 141, 255, .06); text-align: left; display: flex; flex-direction: column; gap: 2px; color: #2f384f">
          <span style="font-size: 15px; font-weight: 600">Normal</span><span style="font-size: 12px; line-height: 16px; color: #4a5a6b">Con cobrador</span>
        </button>
        <button type="button" style="padding: 12px; border: 1px solid #dee2e6; border-radius: 8px; background: #ffffff; text-align: left; display: flex; flex-direction: column; gap: 2px; color: #2f384f">
          <span style="font-size: 15px; font-weight: 600">RapiCompra</span><span style="font-size: 12px; line-height: 16px; color: #4a5a6b">Comisión 6%</span>
        </button>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600">Artículo *</span><input type="text" value="Heladera No Frost 360 L" style="height: 48px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 16px; color: #2f384f; box-sizing: border-box"></label>

      
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600">Cuotas *</span><input class="tab" type="number" inputmode="numeric" value="12" style="height: 48px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 16px; color: #2f384f; box-sizing: border-box; width: 100%"></label>
          <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600">Monto cuota *</span><input class="tab" type="number" inputmode="numeric" value="93400" style="height: 48px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 16px; color: #2f384f; box-sizing: border-box; width: 100%"></label>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 600">Frecuencia</span>
          <div role="group" aria-label="Frecuencia" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px; background: #f0f4f7; border: 1px solid #dee2e6; border-radius: 4px">
            
              <button type="button" style="height: 38px; border: 0; border-radius: 4px; background: #ffffff; box-shadow: 0 2px 8px rgba(9, 30, 66, .06); font-size: 13px; font-weight: 600; color: #2f384f">Semanal</button>
            
              <button type="button" style="height: 38px; border: 0; border-radius: 4px; background: transparent; box-shadow: none; font-size: 13px; font-weight: 600; color: #2f384f">Quincenal</button>
            
              <button type="button" style="height: 38px; border: 0; border-radius: 4px; background: transparent; box-shadow: none; font-size: 13px; font-weight: 600; color: #2f384f">Mensual</button>
            
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 600">Día de cobro *</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            
              <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #108dff; border-radius: 4px; background: rgba(16, 141, 255, .10); font-size: 14px; font-weight: 600; color: #2f384f">Lunes</button>
            
              <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 14px; font-weight: 600; color: #2f384f">Martes</button>
            
              <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 14px; font-weight: 600; color: #2f384f">Miércoles</button>
            
              <button type="button" disabled="" style="height: 40px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #f0f4f7; font-size: 14px; font-weight: 600; color: #8c98a4">Sábado</button>
            
          </div>
          <span style="font-size: 12px; line-height: 16px; color: #4a5a6b">Sábado solo para Tafí del Valle y Leales.</span>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600">Adelanto ($)</span><input class="tab" type="number" inputmode="numeric" value="119200" style="height: 48px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #ffffff; font-size: 16px; color: #2f384f; box-sizing: border-box"></label>
      
      

      <div style="background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 2px 8px rgba(9, 30, 66, .06); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="display: flex; flex-direction: column"><span style="font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #4a5a6b">Total final</span><span class="tab" style="font-size: 13px; line-height: 18px; color: #4a5a6b">12 × $93.400 · semanal</span></span>
        <span class="tab" style="font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.04em">$1.240.000</span>
      </div>
    

    <!-- Paso 4 · Fotos -->
    
  </div>

  <!-- Barra de acciones -->
  <div style="flex-shrink: 0; padding: 12px 16px 28px; background: #ffffff; border-top: 1px solid #dee2e6; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <button type="button" style="height: 52px; border: 1px solid #dee2e6; border-radius: 8px; background: #ffffff; font-size: 15px; font-weight: 600; color: #2f384f">Atrás</button>
    
      <button type="button" style="height: 52px; border: 0; border-radius: 8px; background: #108dff; font-size: 15px; font-weight: 600; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
        Siguiente
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    
    
  </div>
</div></div></div>
</body>
</html>
