<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingreso en celular · CRM Imperio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#2f384f}
a{color:#0e7fe6}a:hover{color:#108dff}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;background:#e9edf2"><div style="box-shadow:0 16px 48px rgba(9,30,66,.20);border-radius:24px;overflow:hidden"><div style="width: 390px; height: 844px; overflow: hidden; background: #2f384f; color: #2f384f; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: -0.01em; font-size: 14px; line-height: 20px; display: flex; flex-direction: column">

  <!-- Marca -->
  <section style="padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 20px; color: #eceef1">
    <img src="../assets/logo.jpg" alt="Imperio Comercial" style="width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #ffffff">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.04em">CRM Imperio</h1>
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #ced4da">De la carga a la entrega, cada venta en un solo lugar.</p>
    </div>
  </section>

  <!-- Hoja con el formulario -->
  <form style="flex: 1; background: #ffffff; border-radius: 8px 8px 0 0; box-shadow: 0 16px 48px rgba(9, 30, 66, .20); padding: 12px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #dee2e6"></span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Ingresá</h2>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #4a5a6b">Usá el usuario que te dio el administrador.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="usrm" style="font-size: 13px; font-weight: 600">Usuario</label>
      <input id="usrm" type="text" autocomplete="username" placeholder="nombre.apellido" style="height: 48px; padding: 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #f0f4f7; font: inherit; font-size: 16px; color: #2f384f; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pwdm" style="font-size: 13px; font-weight: 600">Contraseña</label>
      <div style="position: relative">
        <input id="pwdm" type="password" autocomplete="current-password" style="width: 100%; height: 48px; padding: 0 52px 0 14px; border: 1px solid #108dff; border-radius: 4px; background: #ffffff; box-shadow: 0 0 0 3px rgba(16, 141, 255, .18); font: inherit; font-size: 16px; color: #2f384f; box-sizing: border-box">
        <button type="button" aria-label="Mostrar contraseña" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; color: #4a5a6b; display: inline-flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <p role="alert" style="margin: 0; display: flex; gap: 8px; padding: 10px 12px; border-radius: 4px; background: #f0f4f7; font-size: 13px; line-height: 18px">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #e7366b; width: 16px; height: 16px; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
      Usuario o contraseña incorrectos. Te quedan 3 intentos.
    </p>
    <a href="Movil.html" style="margin-top: auto; height: 52px; border-radius: 8px; background: #108dff; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      Ingresar
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
    </a>
    <span style="text-align: center; font-size: 12px; line-height: 16px; color: #4a5a6b">Tucumán · Santiago del Estero · Catamarca</span>
  </form>
</div></div></div>
</body>
</html>
